<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TSLA Spread · вход</title>
<style>
:root{--bg:#f4f4f2;--card:#fcfcfb;--text:#0b0b0b;--muted:#52514e;--line:#e2e1dc;--accent:#2a78d6;--bad:#d03b3b}
@media (prefers-color-scheme:dark){:root{--bg:#111110;--card:#1a1a19;--text:#f0efec;--muted:#c3c2b7;--line:#2e2e2b;--accent:#3987e5}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);
font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px;width:100%;max-width:340px}
h1{font-size:18px;margin:0 0 4px}p{margin:0 0 20px;color:var(--muted);font-size:13px}
input{width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px}
button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
.err{color:var(--bad);font-size:13px;margin-top:10px;display:none}
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>TSLA спред-монитор</h1>
  <p>Lighter (шорт) ↔ Jupiter (TSLAx)</p>
  <input type="password" name="password" placeholder="Пароль" autofocus autocomplete="current-password">
  <button type="submit">Войти</button>
  <div class="err" id="e">Неверный пароль</div>
</form>
<script>if(location.search.includes('e=1'))document.getElementById('e').style.display='block'</script>
</body>
</html>
